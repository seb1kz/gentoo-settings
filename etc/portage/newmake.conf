COMMON_FLAGS="-march=native -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
  // only thing to change if you have less cores or ram change it to number that show after you type nproc
MAKEOPTS="-j12"
EMERGE_DEFAULT_OPTS="--autounmask --autounmask-write"
USE_FONTS="ComicShannsMonoNerdFontMono-Bold"
USE="truetype dist-kernel ${USE} networkmanager -telemetry -crashreporter -systemd -doc X -test alsa"
FEATURES="${FEATURES} binpkg-request-signature"
# NOTE: This stage was built with the bindist USE flag enabled

# This sets the language of build output to English.
# Please keep this setting intact when reporting bugs.
LC_MESSAGES=C.UTF-8
GRUB_PLATFORMS="efi-64"
