[font]
size = 13.0

[font.bold]
family = "ComicShannsMono Nerd Font"

[colors.primary]
background = "#0d1117"
foreground = "#c9d1d9"

[colors.cursor]
text = "#0d1117"
cursor = "#a371f7"

[colors.selection]
text = "#ffffff"
background = "#8957e5"

[colors.normal]
black   = "#484f58"
red     = "#ff7b72"
green   = "#3fb950"
yellow  = "#d29922"
blue    = "#8957e5"
magenta = "#bc8cff"
cyan    = "#39c5cf"
white   = "#b1bac4"

[colors.bright]
black   = "#6e7681"
red     = "#ffa198"
green   = "#56d364"
yellow  = "#e3b341"
blue    = "#a371f7"
magenta = "#d2a8ff"
cyan    = "#56d4dd"
white   = "#f0f6fc"

[terminal.shell]
program = "/bin/zsh"
