# --- APARYCJA I KOLORY ---
border_px = 0
# monitor
monitor_rule=name:^HDMI-1$,width:1920,height:1080,refresh:240,x:0,y:0,scale:1
# mysz
device_rule=type:pointer,accel_profile:1,accel_speed:-0.30
# dzwiek
exec_once = pipewire
exec_once = sleep 1 && wireplumber
exec_once = sleep 1 && pipewire-pulse

# --- SKRÓTY KLAWISZOWE ---
# Mod4 = Super (Windows Key)

# autostart
exec_once = xdg-desktop-portal-gtk
exec_once = xdg-desktop-portal-wlr
exec_once = xdg-desktop-portal
exec_once = waybar
exec_once = swaybg -i /home/seb/Downloads/wallpapers/better.png

# Programy i skróty systemowe
bind = Super+Shift, S, spawn, flameshot gui
bind = Super, S, spawn, rofi -show drun
bind = Super, Return, spawn, alacritty

# Obsługa paska i okien
bind = Super, J, focusstack, +1
bind = Super, K, focusstack, -1
bind = Super, I, incnmaster, +1
bind = Super, O, incnmaster, -1
bind = Super, H, setmfact, -0.05
bind = Super, L, setmfact, +0.05
bind = Super, P, zoom
bind = Super, Tab, view, 0
bind = Super, Q, killclient
bind = Super+Shift, Space, togglefloating
bind = Super+Shift, Q, quit

# Układy (Layouts)
bind = Super, T, setlayout, tile
bind = Super, F, setlayout, float
bind = Super, M, setlayout, monocle
bind = Super, Space, setlayout, cycle

# Tag 0 (widok wszystkich / przypisanie do wszystkich)
bind = Super, 0, view, all
bind = Super+Shift, 0, tag, all

# Przełączanie monitorów
bind = Super, comma, focusmon, -1
bind = Super, period, focusmon, +1
bind = Super+Shift, comma, tagmon, -1
bind = Super+Shift, period, tagmon, +1

# Tag 1-9
bind = Super, 1, view, 1
bind = Super, 2, view, 2
bind = Super, 3, view, 3
bind = Super, 4, view, 4
bind = Super, 5, view, 5
bind = Super, 6, view, 6
bind = Super, 7, view, 7
bind = Super, 8, view, 8
bind = Super, 9, view, 9

bind = Super+Ctrl, 1, toggleview, 1
bind = Super+Ctrl, 2, toggleview, 2
bind = Super+Ctrl, 3, toggleview, 3
bind = Super+Ctrl, 4, toggleview, 4
bind = Super+Ctrl, 5, toggleview, 5
bind = Super+Ctrl, 6, toggleview, 6
bind = Super+Ctrl, 7, toggleview, 7
bind = Super+Ctrl, 8, toggleview, 8
bind = Super+Ctrl, 9, toggleview, 9
